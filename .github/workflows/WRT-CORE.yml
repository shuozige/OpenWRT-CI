#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            # 通用配置先写入，目标配置后写入，保证 S20P 等设备专属选项优先。
            cat $GITHUB_WORKSPACE/Config/GENERAL.txt $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          # Packages.sh 已将 VIKINGYFY/packages 的 sing-box 作为唯一主包放入 package/sing-box。
          # 这里仅验证唯一规范入口，不再在 defconfig 前复制、提升、删除源码，避免误伤 feeds/base 链接。
          SING_BOX_MAIN="./package/sing-box"
          if [ ! -f "$SING_BOX_MAIN/Makefile" ]; then
            echo "sing-box-source-not-found: $SING_BOX_MAIN/Makefile"
            exit 1
          fi
          if [ "$(find -L "$SING_BOX_MAIN" -maxdepth 1 -type f -name Makefile -print | wc -l)" -ne 1 ]; then
            echo "sing-box-main-makefile-invalid"
            exit 1
          fi
          echo "sing-box canonical source: $SING_BOX_MAIN/Makefile"
          # .config 中写成 y 不能证明包一定被 OpenWrt 注册；先逐项检查 Makefile 和 Package 定义。
          for REQUIRED_SPEC in \
            "sing-box:./package/sing-box/Makefile" \
            "naiveproxy:./package/naiveproxy/Makefile" \
            "mihomo:./package/mihomo/Makefile" \
            "luci-app-passwall:./package/luci-app-passwall/Makefile" \
            "luci-app-passwall2:./package/luci-app-passwall2/Makefile" \
            "luci-app-ssr-plus:./package/luci-app-ssr-plus/Makefile" \
            "luci-app-openclash:./package/luci-app-openclash/Makefile" \
            "luci-app-homeproxy:./package/luci-app-homeproxy/Makefile" \
            "luci-app-store:./package/luci-app-store/Makefile" \
            "luci-lib-taskd:./package/luci-lib-taskd/Makefile" \
            "luci-lib-xterm:./package/luci-lib-xterm/Makefile" \
            "taskd:./package/taskd/Makefile" \
            "luci-app-dockerman:./package/luci-app-dockerman/Makefile" \
            "luci-lib-docker:./package/luci-lib-docker/Makefile" \
            "kcptun-client:./package/kcptun-client/Makefile"; do
            NAME="${REQUIRED_SPEC%%:*}"
            MAKEFILE="${REQUIRED_SPEC#*:}"
            if [ ! -f "$MAKEFILE" ]; then
              echo "package-source-missing: $NAME ($MAKEFILE)"
              exit 1
            fi
            # 标准包使用 define Package/...；LuCI 官方包也可能使用 LUCI_TITLE + PKG_NAME，并由 luci.mk 注册。
            if ! grep -Eq "^define Package/$NAME([/:]|$)" "$MAKEFILE" \
              && ! grep -Eq '^define Package/\$\(PKG_NAME\)' "$MAKEFILE" \
              && ! grep -q '^LUCI_TITLE:=' "$MAKEFILE"; then
              echo "package-definition-missing: $NAME ($MAKEFILE)"
              exit 1
            fi
          done
          echo "critical package sources and definitions: present"

          DEFCONFIG_LOG="$GITHUB_WORKSPACE/defconfig.log"
          if ! make defconfig -j$(nproc) 2>&1 | tee "$DEFCONFIG_LOG"; then
            echo "defconfig-failed"
            exit 1
          fi

          # defconfig 会扫描所有 feeds，即使未选中的可选包也可能发出不存在依赖警告。
          # 只对 .config 实际选中的包判定为阻塞，避免把未参与本固件的包误报成失败。
          SELECTED_DEPENDENCY_WARNINGS=0
          while IFS= read -r WARNING; do
            [ -n "$WARNING" ] || continue
            MAKEFILE=$(sed -n "s/^WARNING: Makefile '\\([^']*\\)'.*/\\1/p" <<< "$WARNING")
            PKG_NAME=$(sed -n 's/^PKG_NAME:=//p' "$MAKEFILE" 2>/dev/null | head -n 1)
            if [ -n "$PKG_NAME" ] && grep -Eq "^CONFIG_PACKAGE_${PKG_NAME}=(y|m)$" .config; then
              echo "$WARNING"
              SELECTED_DEPENDENCY_WARNINGS=1
            fi
          done < <(grep -Ei "WARNING: Makefile .* dependency on '.*', which does not exist" "$DEFCONFIG_LOG" || true)
          if [ "$SELECTED_DEPENDENCY_WARNINGS" -ne 0 ]; then
            echo "defconfig-selected-dependency-audit-failed"
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_sing-box=y' .config; then
            echo "sing-box-defconfig-missing"
            grep -R "define Package/sing-box" ./package ./feeds 2>/dev/null | head -n 20 || true
            exit 1
          fi
          for REQUIRED in mihomo naiveproxy xray-core v2ray-core hysteria tuic-client docker docker-compose dockerd luci-app-store; do
            if ! grep -q "^CONFIG_PACKAGE_"$REQUIRED"=y" .config; then
              echo "required-package-missing: "$REQUIRED""
              exit 1
            fi
          done
          echo "sing-box and required package selections: enabled"

      - name: Preflight Package Metadata
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # 先拦截 APK 无法接受的版本号，避免完整编译数小时后才在打包阶段失败。
          # 当前最常见的来源是第三方 LuCI 包把 Git 标签的 v 前缀直接写进 PKG_VERSION。
          INVALID_APK_VERSIONS=0
          while IFS= read -r MAKEFILE; do
            [ -f "$MAKEFILE" ] || continue
            PKG_NAME=$(sed -n 's/^PKG_NAME:=//p' "$MAKEFILE" | head -n 1)
            [ -n "$PKG_NAME" ] || continue
            PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "$MAKEFILE" | head -n 1)
            if grep -Eq "^CONFIG_PACKAGE_${PKG_NAME}=(y|m)$" .config && [ -n "$PKG_VERSION" ]; then
              case "$PKG_VERSION" in
                [0-9]*) ;;
                v*|V*|null|NULL|undefined|UNDEFINED)
                  echo "invalid-selected-apk-version: $PKG_NAME ($MAKEFILE): PKG_VERSION=$PKG_VERSION"
                  INVALID_APK_VERSIONS=1
                  ;;
                *)
                  # 允许由 Make 展开后得到数字版本的表达式；其余静态非数字版本仍提前拦截。
                  if [[ "$PKG_VERSION" == *'$('* || "$PKG_VERSION" == *'${'* ]]; then
                    :
                  else
                    echo "invalid-selected-apk-version: $PKG_NAME ($MAKEFILE): PKG_VERSION=$PKG_VERSION"
                    INVALID_APK_VERSIONS=1
                  fi
                  ;;
              esac
            fi
          done < <(find -L ./package ./feeds -type f -name Makefile -print 2>/dev/null | sort -u)
          if [ "$INVALID_APK_VERSIONS" -ne 0 ]; then
            echo "preflight-package-version-audit-failed"
            exit 1
          fi

          # 关键包必须仍然由实体 Makefile 提供，且配置没有被 defconfig 清掉。
          for REQUIRED in sing-box mihomo naiveproxy xray-core v2ray-core hysteria tuic-client tuic-server docker docker-compose dockerd luci-lib-docker luci-app-dockerman luci-app-store; do
            if ! grep -q "^CONFIG_PACKAGE_$REQUIRED=y" .config; then
              echo "preflight-required-package-missing: $REQUIRED"
              exit 1
            fi
          done
          echo "preflight-package-metadata-audit: passed"

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

          # v2ray-geodata 在 Build/Prepare 中按需下载，make download 不会提前取这些数据文件。
          # 先用可重试的 curl 下载并校验，避免并行编译时大文件下载卡住到最后才失败。
          GEO_MAKE="feeds/packages/net/v2ray-geodata/Makefile"
          if [ -f "$GEO_MAKE" ]; then
            download_geo() {
              local package="$1"
              local version="$2"
              local file="$3"
              local hash="$4"
              local url="$5"
              if grep -q "^CONFIG_PACKAGE_$package=y" .config; then
                if [ ! -f "dl/$file" ]; then
                  curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
                    "$url" -o "dl/$file"
                fi
                echo "$hash  dl/$file" | sha256sum -c -
              fi
            }

            GEOIP_VER=$(sed -n 's/^GEOIP_VER:=//p' "$GEO_MAKE")
            GEOIP_HASH=$(sed -n '/^define Download\/geoip/,/^endef/ s/^  HASH:=//p' "$GEO_MAKE")
            GEOSITE_VER=$(sed -n 's/^GEOSITE_VER:=//p' "$GEO_MAKE")
            GEOSITE_HASH=$(sed -n '/^define Download\/geosite$/,/^endef/ s/^  HASH:=//p' "$GEO_MAKE")
            GEOSITE_IRAN_VER=$(sed -n 's/^GEOSITE_IRAN_VER:=//p' "$GEO_MAKE")
            GEOSITE_IRAN_HASH=$(sed -n '/^define Download\/geosite-ir/,/^endef/ s/^  HASH:=//p' "$GEO_MAKE")

            download_geo "v2ray-geoip" "$GEOIP_VER" "geoip.dat.$GEOIP_VER" "$GEOIP_HASH" \
              "https://github.com/v2fly/geoip/releases/download/$GEOIP_VER/geoip.dat"
            download_geo "v2ray-geosite" "$GEOSITE_VER" "dlc.dat.$GEOSITE_VER" "$GEOSITE_HASH" \
              "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_VER/dlc.dat"
            download_geo "v2ray-geosite-ir" "$GEOSITE_IRAN_VER" "iran.dat.$GEOSITE_IRAN_VER" "$GEOSITE_IRAN_HASH" \
              "https://github.com/bootmortis/iran-hosted-domains/releases/download/$GEOSITE_IRAN_VER/iran.dat"
          fi

      - name: Preflight Build Dependencies
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-reports"

          # 只提前建立 tools -> toolchain -> target 依赖链；所有选中软件包只在最终并行固件编译中编译一次。
          # 全量 package/compile -j1 会把 libcronet 等大型包串行化，容易超过 GitHub Actions 的 6 小时上限。
          run_make() {
            local NAME="$1"
            shift
            make "$@" -j$(nproc) V=s 2>&1 | tee "$GITHUB_WORKSPACE/build-reports/preflight-$NAME.log"
          }
          run_make tools-compile tools/compile
          # tools 就绪后立即验证 sing-box 解包与 libcronet 补丁应用，避免等数十分钟才暴露补丁格式错误。
          run_make sing-box-prepare package/sing-box/prepare
          run_make toolchain-compile toolchain/compile
          run_make target-compile target/compile

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          set -o pipefail
          LOG_DIR="$GITHUB_WORKSPACE/build-reports"
          mkdir -p "$LOG_DIR"

          set +e
          make -j$(nproc) BUILD_LOG=1 BUILD_TIME_LOG="$LOG_DIR/parallel.tsv" 2>&1 | \
            tee "$LOG_DIR/compile-parallel.log"
          PARALLEL_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$PARALLEL_STATUS" -eq 0 ]; then
            exit 0
          fi

          mapfile -t FAILED_PACKAGES < <(
            sed -n 's/.*ERROR: \(package\/[^ ]*\) failed to build.*/\1/p' \
              "$LOG_DIR/compile-parallel.log" | tr -d '\r' | sort -u
          )
          if [ "${#FAILED_PACKAGES[@]}" -eq 0 ]; then
            echo "parallel build failed without a package-level error; preserve the full log and stop"
            exit "$PARALLEL_STATUS"
          fi

          for PKG in "${FAILED_PACKAGES[@]}"; do
            SAFE_PKG=$(printf '%s' "$PKG" | tr '/' '_')
            set +e
            make -j1 V=s BUILD_LOG=1 "$PKG/compile" 2>&1 | \
              tee "$LOG_DIR/failed-${SAFE_PKG}.log"
            PACKAGE_STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$PACKAGE_STATUS" -ne 0 ]; then
              echo "single-package diagnostic failed: $PKG"
              exit "$PACKAGE_STATUS"
            fi
          done

          make -j1 V=s BUILD_LOG=1 BUILD_TIME_LOG="$LOG_DIR/serial.tsv" 2>&1 | \
            tee "$LOG_DIR/compile-serial.log"

      - name: Audit Built Firmware
        if: ${{ !inputs.WRT_TEST && success() }}
        run: |
          cd ./wrt/
          MANIFEST=$(find ./bin/targets -type f -name '*.manifest' -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "firmware-manifest-missing"
            exit 1
          fi
          for REQUIRED in \
            luci-app-passwall luci-app-passwall2 luci-app-ssr-plus luci-app-openclash \
            luci-app-store luci-app-homeproxy luci-lib-docker luci-app-dockerman \
            docker docker-compose dockerd sing-box mihomo xray-core v2ray-core \
            hysteria naiveproxy tuic-client tuic-server trojan; do
            if ! grep -Eq "^${REQUIRED}([[:space:]]|$)" "$MANIFEST"; then
              echo "firmware-manifest-missing-package: $REQUIRED"
              exit 1
            fi
          done
          SYSUPGRADE=$(find ./bin/targets -type f -iname '*sysupgrade*.bin' -print -quit)
          if [ -z "$SYSUPGRADE" ]; then
            echo "sysupgrade-image-missing"
            exit 1
          fi
          echo "firmware audit passed: $SYSUPGRADE"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && always() && !cancelled() && steps.cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
